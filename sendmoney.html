<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alke Wallet - Enviar dinero</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="index_style.css">
  <link rel="stylesheet" href="menustyles.css">
</head>
<body class="bg-wallet">

  <nav class="navbar navbar-expand-lg navbar-dark bg-transparent px-3">
    <a class="navbar-brand" href="menu.html">Alke Wallet</a>
  </nav>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6">
        <div class="card wallet-card p-4">
          <h2 class="h5 mb-3">Enviar dinero</h2>

          <p class="mb-1 text-muted">Saldo actual</p>
          <h3 class="mb-3">$ <span id="sendBalance">0</span></h3>

          <form id="sendForm">
            <div class="mb-3">
              <label for="contact" class="form-label">Contacto</label>
              <input
                type="text"
                class="form-control"
                id="contact"
                placeholder="Nombre o correo"
                required
              >
            </div>

            <div class="mb-3">
              <label for="amountSend" class="form-label">Monto a enviar</label>
              <input
                type="number"
                class="form-control"
                id="amountSend"
                min="1"
                required
              >
            </div>

            <div class="d-grid mb-2">
              <button type="submit" class="btn btn-wallet btn-wallet-primary">
                Enviar dinero
              </button>
            </div>

            <div id="sendMessage" class="small mt-2 d-none">
              
            </div>
          </form>

          <h6 class="mt-4 mb-2">Contactos recientes</h6>
          <ul class="list-group small" id="contactsList">
             
          </ul>

          <a href="menu.html" class="btn btn-link mt-3 text-decoration-none">
            ← Volver al menú
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="menu.js"></script>
</body>
</html>
