<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Alke Wallet - Inicio de sesión</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="./assets/css/index_style.css" />
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-wallet">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-lg p-4 wallet-card">
          <h1 class="h4 text-center mb-3 text-white">Alke Wallet</h1>
          <p class="text-center text-muted mb-4">Inicia sesión para continuar</p>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label text-white">Correo</label>
              <input type="email" class="form-control" id="email" required />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label text-white">Contraseña</label>
              <input type="password" class="form-control" id="password" required />
            </div>

            <div class="d-grid mb-2">
              <button type="submit" class="btn btn-wallet btn-wallet-primary">
                Iniciar sesión
              </button>
            </div>

            <div id="loginError" class="text-danger small mt-2 d-none">
              Usuario o contraseña incorrectos
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/menu.js"></script>
</body>
</html>
