<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alke Wallet - Menú</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="./assets/css/index_style.css">
  <link rel="stylesheet" href="./assets/css/menustyles.css">
</head>
<body class="bg-wallet">

 
  <nav class="navbar navbar-expand-lg navbar-dark bg-transparent px-3">
    <a class="navbar-brand" href="#">Alke Wallet</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarWallet">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarWallet">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="deposit.html">Depositar</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="sendmoney.html">Enviar dinero</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="transactions.html">Movimientos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" id="logoutBtn">Salir</a>
        </li>
      </ul>
    </div>
  </nav>

  
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card wallet-card p-4 mb-4">
          <div class="wallet-balance mb-3">
            <p class="mb-1 text-muted">Saldo disponible</p>
            <h2 class="mb-0" id="currentBalance">$ <span id="balanceAmount">0</span></h2>
          </div>

          <div class="d-grid gap-2">
            <a href="deposit.html" class="btn btn-wallet btn-wallet-primary">Depositar</a>
            <a href="sendmoney.html" class="btn btn-wallet btn-wallet-secondary">Enviar dinero</a>
            <a href="transactions.html" class="btn btn-wallet btn-wallet-secondary">Últimos movimientos</a>
          </div>
        </div>

        
        <div class="card wallet-card p-3">
          <h6 class="text-white mb-3">Resumen rápido</h6>
          <ul class="list-unstyled mb-0" id="quickTransactions">
            
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/menu.js"></script>
</body>
</html>
