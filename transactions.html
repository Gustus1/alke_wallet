<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alke Wallet - Movimientos</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/index_style.css">
  <link rel="stylesheet" href="./assets/css/menustyles.css">
</head>
<body class="bg-wallet">

  <nav class="navbar navbar-expand-lg navbar-dark bg-transparent px-3">
    <a class="navbar-brand" href="menu.html">Alke Wallet</a>
  </nav>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8">
        <div class="card wallet-card p-4">
          <h2 class="h5 mb-3">Últimos movimientos</h2>

          <div class="table-responsive">
            <table class="table table-dark table-striped align-middle mb-0">
              <thead>
                <tr>
                  <th scope="col">Fecha</th>
                  <th scope="col">Tipo</th>
                  <th scope="col" class="text-end">Monto</th>
                </tr>
              </thead>
              <tbody id="txTableBody">
                
              </tbody>
            </table>
          </div>

          <p class="small text-muted mt-3 mb-0">
            Movimientos guardados.
          </p>

          <a href="menu.html" class="btn btn-link mt-3 text-decoration-none">
            ← Volver al menú
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/menu.js"></script>
</body>
</html>
