<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alke Wallet - Depósito</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <link rel="stylesheet" href="./assets/css/index_style.css">
  <link rel="stylesheet" href="./assets/css/menustyles.css">
</head>
<body class="bg-wallet">

   <nav class="navbar navbar-expand-lg navbar-dark bg-transparent px-3">
    <a class="navbar-brand" href="menu.html">Alke Wallet</a>
  </nav>

    <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6">
        <div class="card wallet-card p-4">
          <h2 class="h5 mb-3">Realizar depósito</h2>

          <p class="mb-1 text-muted">Saldo actual</p>
          <h3 class="mb-3">$ <span id="depositBalance">0</span></h3>

          <form id="depositForm">
            <div class="mb-3">
              <label for="depositAmount" class="form-label">Monto a depositar</label>
              <input
                type="number"
                class="form-control"
                id="depositAmount"
                min="1"
                required
              >
            </div>

            <div class="d-grid mb-2">
              <button type="submit" class="btn btn-wallet btn-wallet-primary">
                Realizar depósito
              </button>
            </div>

            <div id="depositMessage" class="small mt-2 text-success d-none">
              Depósito realizado con éxito.
            </div>
          </form>

          <a href="menu.html" class="btn btn-link mt-3 text-decoration-none">
            ← Volver al menú
          </a>
        </div>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/menu.js"></script>
</body>
</html>
